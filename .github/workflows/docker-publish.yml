name: Build & Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag da versão (ex: v2, v3, 1.0.0)'
        required: true
        default: 'latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true 
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mirante-front:${{ github.event.inputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mirante-front:latest
          build-args: |
            VITE_API_URL=https://mirante-api.labs.unimar.br